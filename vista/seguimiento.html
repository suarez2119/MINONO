<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguimiento del pedido | MINONO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <a class="visually-hidden-focusable" href="#contenido">Saltar al contenido</a>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark barra-minono">
      <div class="container">
        <a class="navbar-brand" href="../index.html">MINONO</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal" aria-controls="menu-principal" aria-expanded="false" aria-label="Mostrar menú de navegación">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu-principal">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="carrito.html">Carrito <span class="badge bg-light text-dark" id="insignia-carrito">0</span></a></li>
            <li class="nav-item"><a class="nav-link active" href="seguimiento.html" aria-current="page">Mi pedido</a></li>
          </ul>
          <button class="btn btn-light btn-sm ms-lg-2" onclick="cerrarSesionCliente()">Salir</button>
        </div>
      </div>
    </nav>
  </header>

  <main id="contenido" class="container py-4">
    <h1 class="mb-3">Seguimiento de tu pedido</h1>
    <div id="mensajes-seguimiento"></div>

    <section class="row mb-4" aria-label="Buscar pedido">
      <div class="col-md-6">
        <form onsubmit="consultarPedidos(event)">
          <label for="dni-busqueda" class="form-label">DNI</label>
          <div class="input-group">
            <input type="text" id="dni-busqueda" class="form-control" placeholder="Escribe tu DNI" maxlength="8" inputmode="numeric">
            <button type="submit" class="btn btn-minono">Buscar</button>
          </div>
        </form>
      </div>
    </section>

    <section id="resultado" aria-live="polite"></section>
  </main>

  <footer class="pie-minono">
    <div class="container">
      <p class="mb-1">Cafetería MINONO · Panaderia y Pasteleria</p>
      <p class="mb-0 small">Horario de atención: 6:30 a.m. - 10:00 p.m.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../modelo/reglas.js"></script>
  <script src="../modelo/producto.js"></script>
  <script src="../modelo/carrito.js"></script>
  <script src="../modelo/pedido.js"></script>
  <script src="../modelo/cliente.js"></script>
  <script src="vistaComun.js"></script>
  <script src="vistaSeguimiento.js"></script>
  <script src="../controlador/controladorSesion.js"></script>
  <script src="../controlador/controladorSeguimiento.js"></script>
</body>
</html>
